<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b0a"><meta name="description" content="Memory Matrix: desafie sua memória em níveis progressivos na BlackLou Games."><title>Memory Matrix | BlackLou Games</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#263d1d,#080b0a 58%);color:#f4f7f1;font:16px system-ui;display:grid;place-items:center;padding:18px}.app{width:min(94vw,560px);text-align:center}.brand{color:#b7ff35;font-weight:950;letter-spacing:.14em}.brand:before{content:"🐆 ";filter:drop-shadow(0 0 8px #8cff32)}h1{margin:7px;font-size:clamp(2rem,6vw,3rem);text-transform:uppercase}.sub{color:#9eaa9f;margin:0 0 14px}.toolbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.toolbar select,.action,.back{border:1px solid #536c38;border-radius:999px;padding:10px 15px;background:#152018;color:#dfffbd;font-weight:800}.action,.back{background:linear-gradient(#d9ff8d,#aaff35);color:#10150c;text-decoration:none;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{padding:9px;background:#111a13;border:1px solid #344b2b;border-radius:10px;color:#aaff35}.stat b{display:block;color:white;font-size:1.1rem}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.tile{aspect-ratio:1;border:1px solid #466333;border-radius:13px;background:linear-gradient(145deg,#1b2b1e,#101712);color:transparent;font-size:clamp(1.4rem,7vw,2.7rem);cursor:pointer;box-shadow:inset 0 1px #ffffff12;transition:transform .15s,background .15s}.tile:active{transform:scale(.96)}.tile.open{background:linear-gradient(#d9ff8d,#aaff35);color:#10150c;border-color:#e5ffad}.tile.done{background:#355329;color:#d9ff9b;opacity:.75;cursor:default}.status{color:#d9e8d2;min-height:26px;margin:14px 0}.hint{color:#929f94;font-size:.86rem}@media(max-width:380px){.board{gap:6px}.tile{border-radius:9px}}
</style></head><body><main class="app"><div class="brand">BLACKLOU GAMES</div><h1>🧠 Memory Matrix</h1><p class="sub">Memorize os símbolos. Domine a matriz.</p><div class="toolbar"><label for="level">Dificuldade:</label><select id="level"><option value="8">Iniciante · 8 pares</option><option value="10" selected>Caçador · 10 pares</option><option value="12">Lenda · 12 pares</option></select><button class="action" id="restart">NOVO JOGO</button><a class="back" href="../index.html">OUTROS JOGOS</a></div><div class="stats"><div class="stat">JOGADAS<b id="moves">0</b></div><div class="stat">PARES<b id="pairs">0/10</b></div><div class="stat">RECORDE<b id="best">—</b></div></div><div class="board" id="board"></div><p class="status" id="status" aria-live="polite">Encontre todos os pares para vencer.</p><p class="hint">Seu recorde é salvo neste dispositivo. Menos jogadas = maior pontuação.</p></main><script>
const symbols=['🐆','⚡','🎮','💎','🚀','👾','🔥','🌙','🛡️','☄️','🧿','🏆'];let first=null,lock=false,moves=0,pairs=0,total=10,started=0,elapsedTimer=null;const board=document.querySelector('#board'),$=id=>document.getElementById(id);
function key(){return 'memoryMatrixBest'+total}
function showBest(){let v=localStorage.getItem(key());$('best').textContent=v===null?'—':v+' jogadas'}
function start(){clearInterval(elapsedTimer);total=+$('level').value;first=null;lock=false;moves=0;pairs=0;started=Date.now();$('moves').textContent='0';$('pairs').textContent='0/'+total;$('status').textContent='Memorize os símbolos e encontre os pares.';board.style.gridTemplateColumns=total===8?'repeat(4,minmax(0,1fr))':total===10?'repeat(4,minmax(0,1fr))':'repeat(4,minmax(0,1fr))';board.innerHTML='';showBest();let deck=[...symbols.slice(0,total),...symbols.slice(0,total)];for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}deck.forEach((s,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=s;b.setAttribute('aria-label','Carta '+(i+1)+', fechada');b.onclick=()=>flip(b,s);board.append(b)})}
function flip(b,s){if(lock||b.classList.contains('open')||b.classList.contains('done'))return;b.classList.add('open');b.setAttribute('aria-label','Carta revelada '+s);if(!first){first={el:b,s};return}moves++;$('moves').textContent=moves;if(first.s===s){first.el.classList.replace('open','done');b.classList.replace('open','done');first.el.disabled=true;b.disabled=true;first=null;pairs++;$('pairs').textContent=pairs+'/'+total;if(pairs===total){let old=+(localStorage.getItem(key())||Infinity);if(moves<old){localStorage.setItem(key(),moves);showBest()}let secs=Math.round((Date.now()-started)/1000);$('status').textContent='MATRIZ DOMINADA! '+moves+' jogadas em '+secs+'s. Recorde: '+(moves<=old?'novo recorde!':'continue treinando.');clearInterval(elapsedTimer)}}else{lock=true;let prev=first.el;first=null;setTimeout(()=>{prev.classList.remove('open');b.classList.remove('open');prev.setAttribute('aria-label','Carta fechada');b.setAttribute('aria-label','Carta fechada');lock=false},700)}}
$('restart').onclick=start;$('level').onchange=start;start();
</script></body></html>
