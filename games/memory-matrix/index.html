<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Matrix | BlackLou Games</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b0a;color:#f4f7f1;font:16px system-ui;display:grid;place-items:center;padding:20px}.app{width:min(94vw,520px);text-align:center}.brand{color:#b7ff35;font-weight:900;letter-spacing:.12em}.brand:before{content:"🐆";margin-right:9px;filter:drop-shadow(0 0 7px #80ff32)}h1{margin:8px}.meta{display:flex;justify-content:space-around;color:#b7ff35;margin:18px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{aspect-ratio:1;border:1px solid #344533;border-radius:14px;background:#172019;color:transparent;font-size:clamp(1.5rem,7vw,2.5rem);cursor:pointer}.tile.open,.tile.done{background:#b7ff35;color:#10150c}.tile.done{opacity:.45;cursor:default}button.action,.back{display:inline-block;margin:18px 5px 0;border:0;border-radius:999px;padding:11px 18px;background:#b7ff35;color:#10150c;font-weight:900;text-decoration:none;cursor:pointer}.status{color:#9aa49c;min-height:26px}
</style></head><body><main class="app"><div class="brand">BLACKLOU GAMES</div><h1>🧠 Memory Matrix</h1><div class="meta"><span>Jogadas: <b id="moves">0</b></span><span>Pares: <b id="pairs">0/8</b></span></div><div class="board" id="board"></div><p class="status" id="status">Encontre todos os oito pares.</p><button class="action" id="restart">Novo jogo</button><a class="back" href="../index.html">Outros jogos</a></main><script>
const symbols=['🐆','⚡','🎮','💎','🚀','👾','🔥','🌙'];let first=null,lock=false,moves=0,pairs=0;const board=document.querySelector('#board');
function start(){board.innerHTML='';first=null;lock=false;moves=0;pairs=0;document.querySelector('#moves').textContent=0;document.querySelector('#pairs').textContent='0/8';document.querySelector('#status').textContent='Encontre todos os oito pares.';[...symbols,...symbols].sort(()=>Math.random()-.5).forEach((s,i)=>{const b=document.createElement('button');b.className='tile';b.textContent=s;b.setAttribute('aria-label','Carta '+(i+1));b.onclick=()=>flip(b);board.append(b)})}
function flip(b){if(lock||b.classList.contains('open')||b.classList.contains('done'))return;b.classList.add('open');if(!first){first=b;return}moves++;document.querySelector('#moves').textContent=moves;if(first.textContent===b.textContent){first.classList.add('done');b.classList.add('done');first=null;pairs++;document.querySelector('#pairs').textContent=pairs+'/8';if(pairs===8)document.querySelector('#status').textContent='Parabéns! Você completou em '+moves+' jogadas.'}else{lock=true;const prev=first;first=null;setTimeout(()=>{prev.classList.remove('open');b.classList.remove('open');lock=false},750)}}
document.querySelector('#restart').onclick=start;start();
</script></body></html>
