function buildStage(){worldW=3400;camera=0;shake=0;stageWon=false;boss=null;enemies=[];orbs=[];particles=[];decor=[];platforms=[];player={x:90,y:0,vx:0,vy:0,w:48,h:68,hp:5,ground:false,face:1,inv:0,energy:100,attack:0,dash:0,anim:0,checkpoint:90};const floor=H*.78;for(let x=0;x<worldW;x+=180)platforms.push({x,y:floor,w:190,h:90,kind:'floor'});for(let i=0;i<17;i++){let x=250+i*176,y=floor-rand(70,170),w=rand(85,150);platforms.push({x,y,w,h:18,kind:'ledge'})}for(let i=0;i<30;i++)decor.push({x:rand(0,worldW),y:rand(H*.25,floor-15),size:rand(18,70),type:Math.random()>.5?'spire':'tree',depth:rand(.15,.75)});for(let i=0;i<12;i++){let x=340+i*245;enemies.push({x,y:floor-38,hp:i%4===3?4:2,max:i%4===3?4:2,type:i%4===3?'brute':i%3===2?'ranged':'shade',alive:true,dir:-1,attack:rand(.4,2),hit:0})}for(let i=0;i<24;i++)orbs.push({x:230+i*125,y:floor-rand(35,145),type:i%4===0?'gem':i%3===0?'gold':'xp',taken:false,phase:rand(0,6)});checkpoint=90;hud()}

function update(dt){if(mode!=='play')return;sceneTime+=dt;player.anim+=dt*10;player.energy=Math.min(100,player.energy+dt*13);player.attack=Math.max(0,player.attack-dt);player.inv=Math.max(0,player.inv-dt);player.dash=Math.max(0,player.dash-dt);comboTime=Math.max(0,comboTime-dt);const axis=touch.axis||0,left=keys.ArrowLeft||keys.a||touch.left,right=keys.ArrowRight||keys.d||touch.right;if(player.dash<=0){player.vx=Math.abs(axis)>.12?axis*250:left?-250:right?250:0;if(player.vx<0)player.face=-1;if(player.vx>0)player.face=1}player.x+=player.vx*dt;player.vy+=1500*dt;player.y+=player.vy*dt;player.ground=false;for(const p of platforms){if(player.vy>=0&&player.x+20>p.x&&player.x-20<p.x+p.w&&player.y>=p.y-2&&player.y<=p.y+22){player.y=p.y;player.vy=0;player.ground=true}}if(player.y>H+120){hurt(5);player.y=floorY()-120;player.x=Math.max(checkpoint,player.x-100)}player.x=clamp(player.x,20,worldW-40);for(const e of enemies){if(!e.alive)continue;let dx=player.x-e.x;if(Math.abs(dx)<280){e.x+=Math.sign(dx)*((e.type==='brute'?54:78))*dt;e.dir=Math.sign(dx)||1;if(Math.abs(dx)<48&&Math.abs(player.y-e.y)<60){e.attack-=dt;if(e.attack<=0){hurt(e.type==='brute'?2:1);e.attack=e.type==='brute'?1.7:1.2}}}if(e.hit>0)e.hit-=dt}if(boss){boss.phase+=dt;let dx=player.x-boss.x;boss.x+=Math.sign(dx)*32*dt;if(Math.abs(dx)<85&&Math.abs(player.y-boss.y)<100){boss.attack-=dt;if(boss.attack<=0){hurt(2);boss.attack=1.55}}else boss.attack=Math.max(0,boss.attack-dt)}for(const o of orbs){if(o.taken)continue;o.phase+=dt*3;if(Math.abs(o.x-player.x)<32&&Math.abs(o.y-player.y+30)<52){o.taken=true;if(o.type==='gold')data.gold+=10;else if(o.type==='gem')data.gems++;else addXP(12);spawnParticles(o.x,o.y,'#ffdf7d',8);save();hud()}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=480*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);camera=clamp(player.x-W*.35,0,worldW-W);if(player.x>worldW-230&&!boss){boss={x:worldW-120,y:floorY(),hp:42+chapter*8,max:42+chapter*8,attack:1.2,phase:0};$('bossname').textContent=chapters[chapter].boss;hud()}if(player.x>worldW-65&&boss&&boss.hp<=0)winStage();if(player.x>worldW-80&&boss===null){}if(player.hp<=0)return;hud()}
function winStage(){if(stageWon)return;stageWon=true;mode='clear';data.gold+=100;data.gems+=3;addXP(120);data.unlocked=Math.max(data.unlocked,Math.min(5,chapter+1));data.currentChapter=Math.min(5,chapter+1);save();$('overlay').style.display='flex';$('hud').style.display='none';$('controls').style.display='none';$('panel').innerHTML='<div class="eyebrow">GUARDIÃO DERROTADO</div><h1>VITÓRIA<br><em>ESMERALDA</em></h1><p class="modaltext">'+chapters[chapter].boss+' foi derrotado. Noctara recupera um fragmento de sua luz.</p><div class="currencies"><span class="currency">+100 OURO</span><span class="currency">+3 GEMAS</span><span class="currency">+120 XP</span></div><button class="btn mainbtn" id="next">CONTINUAR</button><button class="btn secondary" id="home">MENU PRINCIPAL</button>';$('next').onclick=()=>{chapter=Math.min(5,chapter+1);data.currentChapter=chapter;save();startStage()};$('home').onclick=showMenu}

function drawWorld(){ctx.save();ctx.translate(-camera,0);const floor=floorY(),c=chapters[chapter];for(const d of decor){let x=d.x,y=d.y;if(x<camera-100||x>camera+W+100)continue;ctx.globalAlpha=d.depth*.5;ctx.fillStyle='#07100e';if(d.type==='spire'){polygon([[x-d.size*.3,floor],[x,floor-d.size*2],[x+d.size*.4,floor]],'#0b1713','#263d30')}else{ctx.fillRect(x-4,y,8,floor-y);ctx.beginPath();ctx.arc(x,y,d.size*.45,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
 for(const p of platforms){if(p.x+p.w<camera-20||p.x>camera+W+20)continue;ctx.fillStyle=p.kind==='floor'?c.ground:'#324b3b';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle=c.accent;ctx.globalAlpha=.55;ctx.fillRect(p.x,p.y,p.w,3);ctx.globalAlpha=1;polygon([[p.x,p.y],[p.x+13,p.y-8],[p.x+p.w+12,p.y-8],[p.x+p.w,p.y]],'#536d4d');ctx.fillStyle='#101c17';for(let j=15;j<p.w;j+=35)ctx.fillRect(p.x+j,p.y+18,3,25)}
 for(const o of orbs){if(o.taken||o.x<camera-40||o.x>camera+W+40)continue;let yy=o.y+Math.sin(sceneTime*3+o.phase)*6;let color=o.type==='gem'?'#6deaff':o.type==='gold'?'#ffd477':'#baff45';ctx.shadowColor=color;ctx.shadowBlur=16;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(o.x,yy-10);ctx.lineTo(o.x+8,yy);ctx.lineTo(o.x,yy+10);ctx.lineTo(o.x-8,yy);ctx.closePath();ctx.fill();ctx.shadowBlur=0}
 for(const e of enemies){if(!e.alive||e.x<camera-100||e.x>camera+W+100)continue;ctx.save();ctx.translate(e.x,e.y);const brute=e.type==='brute',ranged=e.type==='ranged',col=brute?'#a64b43':ranged?'#638fbd':'#6c9273',pulse=Math.sin(sceneTime*5+e.x)*1.5;ctx.shadowColor=col;ctx.shadowBlur=brute?19:12;
 // feet and crooked legs
 ctx.strokeStyle='#111b17';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,-12);ctx.lineTo(-12,0);ctx.moveTo(8,-12);ctx.lineTo(12,0);ctx.stroke();
 // torso silhouette with layered hide / armor
 ctx.fillStyle=e.hit>0?'#fff':col;ctx.strokeStyle=brute?'#e49b73':'#a1c4a0';ctx.lineWidth=1.5;ctx.beginPath();if(brute){ctx.moveTo(-25,-12);ctx.lineTo(-29,-47);ctx.lineTo(-17,-65);ctx.lineTo(17,-65);ctx.lineTo(29,-43);ctx.lineTo(24,-10);ctx.closePath()}else{ctx.moveTo(-16,-10);ctx.lineTo(-19,-37);ctx.lineTo(-12,-54);ctx.lineTo(12,-54);ctx.lineTo(19,-35);ctx.lineTo(15,-9);ctx.closePath()}ctx.fill();ctx.stroke();
 // shoulder plates and spikes
 for(let k=0;k<3;k++){const xx=(k-1)*(brute?17:11);polygon([[xx-7,-43],[xx,-59-(k%2)*7],[xx+8,-42]],brute?'#3b2523':'#263b31','#80977a')}
 // head, horns and jaw
 ctx.fillStyle='#111914';ctx.beginPath();ctx.ellipse(0,-61-(brute?2:0),brute?17:13,brute?15:12,0,0,Math.PI*2);ctx.fill();polygon([[-10,-68],[-17,-83],[-3,-74]],'#111914','#70856c');polygon([[5,-74],[17,-84],[12,-66]],'#111914','#70856c');
 ctx.shadowColor='#ff5261';ctx.shadowBlur=13;ctx.fillStyle='#ff5963';ctx.fillRect(-9,-64+pulse,6,3);ctx.fillRect(4,-64-pulse,6,3);ctx.shadowBlur=0;
 // chest rune and weapon / ranged energy
 if(brute){ctx.fillStyle='#e28b52';polygon([[-7,-42],[0,-51],[8,-42],[0,-32]],'#d8894e','#ffd18c');ctx.fillStyle='#25201d';ctx.fillRect(19,-34,13,6)}else if(ranged){ctx.strokeStyle='#8deaff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-29,10,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#8deaff';ctx.beginPath();ctx.arc(0,-29,4,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#baff45';ctx.fillRect(-3,-39,6,7)}
 ctx.restore()}
 if(boss){ctx.save();ctx.translate(boss.x,boss.y);ctx.shadowColor=c.accent;ctx.shadowBlur=25;ctx.fillStyle='#171d19';ctx.strokeStyle=c.accent;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-48,-8);ctx.lineTo(-42,-85);ctx.lineTo(-18,-112);ctx.lineTo(0,-92);ctx.lineTo(25,-118);ctx.lineTo(48,-70);ctx.lineTo(54,-8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=c.accent;ctx.fillRect(-21,-78,10,5);ctx.fillRect(11,-78,10,5);ctx.restore()}
 if(player){let sk=skins[data.skin]||skins.onyx;drawPanther(player.x,player.y,1,player.face,player.anim,player.attack>0,sk.glow,player.inv>0&&Math.floor(sceneTime*14)%2===0?.35:1)}
 for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore()}
function drawMenuArt(){
 const t=sceneTime,base=H*.91,portalX=W*.76,portalY=H*.43,portalR=Math.min(W,H)*.235;
 // distant citadel silhouette
 ctx.save();ctx.globalAlpha=.92;ctx.fillStyle='#07110f';
 for(let i=0;i<9;i++){const x=W*(.48+i*.065),h=H*(.22+(i%3)*.075),w=Math.max(24,W*.035);ctx.fillRect(x,base-h,w,h);ctx.beginPath();ctx.moveTo(x-8,base-h);ctx.lineTo(x+w/2,base-h-22);ctx.lineTo(x+w+8,base-h);ctx.closePath();ctx.fill();ctx.fillStyle='#aaff4530';ctx.fillRect(x+w*.35,base-h*.72,4,12);ctx.fillStyle='#07110f'}
 // portal rings and emerald light
 const halo=ctx.createRadialGradient(portalX,portalY,portalR*.12,portalX,portalY,portalR*1.5);halo.addColorStop(0,'#42ff8b55');halo.addColorStop(.55,'#23c96c28');halo.addColorStop(1,'transparent');ctx.fillStyle=halo;ctx.fillRect(portalX-portalR*1.6,portalY-portalR*1.6,portalR*3.2,portalR*3.2);
 for(let i=0;i<7;i++){ctx.beginPath();ctx.ellipse(portalX,portalY,portalR*(.48+i*.085),portalR*(.78+i*.09),Math.sin(t*.18+i)*.035,0,Math.PI*2);ctx.strokeStyle=i%2?'#7bff9a66':'#baff45aa';ctx.lineWidth=Math.max(2,Math.min(7,W*.004));ctx.shadowColor='#32ff83';ctx.shadowBlur=18;ctx.stroke()}
 // monumental stairs and wet reflective floor
 ctx.shadowBlur=0;for(let i=0;i<8;i++){const y=base-i*H*.027,w=W*(.54-i*.035);ctx.fillStyle=i%2?'#101b17':'#1c2b22';ctx.fillRect(W*.73-w/2,y,w,H*.026);ctx.fillStyle='#9cff6a55';ctx.fillRect(W*.73-w/2,y,w,2)}
 const floor=ctx.createLinearGradient(0,base,0,H);floor.addColorStop(0,'#1a3025');floor.addColorStop(1,'#050a08');ctx.fillStyle=floor;ctx.fillRect(0,base,W,H-base);
 for(let i=0;i<34;i++){const x=(i*137+t*9)%(W+20),y=base+8+(i*19%(Math.max(20,H-base-8)));ctx.strokeStyle=i%3?'#8dff8b18':'#c9ff9a35';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+18+(i%5)*9,y);ctx.stroke()}
 // foreground pillars
 for(const side of [0,1]){const x=side?W*.94:W*.54,h=H*(side?.42:.34);ctx.fillStyle='#0a1511';ctx.fillRect(x,base-h,W*.035,h);ctx.fillStyle='#415d42';ctx.fillRect(x-8,base-h,W*.045,8);ctx.fillStyle='#aaff4544';ctx.fillRect(x+W*.012,base-h+18,3,h-20)}
 // armored guardian, scaled to dominate the right side
 const scale=Math.min(5.2,Math.max(3.25,Math.min(W*.0045,H*.009)));ctx.translate(W*.77,base-5+Math.sin(t*2)*2);drawPanther(0,0,scale,-1,t*3,false,'#baff45',1);
 ctx.restore();
 const shade=ctx.createLinearGradient(0,0,W*.68,0);shade.addColorStop(0,'#020604ed');shade.addColorStop(.55,'#020604a8');shade.addColorStop(1,'transparent');ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
}
function render(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);if(mode==='menu'){chapter=clamp(chapter,0,5);drawBackground();camera=0;drawMenuArt()}else{drawBackground();drawWorld()}if(mode==='play'&&player){ctx.fillStyle='#eaffc9';ctx.globalAlpha=.6;ctx.fillRect(14,H-7,Math.max(0,(W-28)*(player.energy/100)),3);ctx.globalAlpha=1}}
function showClear(){winStage()}
function bindButton(el,down,up){const release=e=>{if(e)e.preventDefault();el.classList.remove('down');if(up)up()};el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('down');try{el.setPointerCapture(e.pointerId)}catch(_){}down()});el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);el.addEventListener('lostpointercapture',release);el.addEventListener('contextmenu',e=>e.preventDefault())}
const joy=$('joystick'),joyKnob=$('joyKnob');let joyPointer=null;
function updateJoystick(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,len=Math.hypot(dx,dy)||1,scale=Math.min(1,max/len),x=dx*scale,y=dy*scale;joyKnob.style.transform=`translate(${x}px,${y}px)`;touch.axis=clamp(dx/max,-1,1);touch.left=touch.axis<-.12;touch.right=touch.axis>.12;joy.classList.add('active')}
function resetJoystick(){joyPointer=null;touch.axis=0;touch.left=touch.right=false;joyKnob.style.transform='translate(0,0)';joy.classList.remove('active')}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch(_){}updateJoystick(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer){e.preventDefault();updateJoystick(e)}});
joy.addEventListener('pointerup',e=>{if(e.pointerId===joyPointer)resetJoystick()});joy.addEventListener('pointercancel',resetJoystick);joy.addEventListener('lostpointercapture',resetJoystick);
document.querySelectorAll('[data-key]').forEach(b=>bindButton(b,()=>touch[b.dataset.key]=true,()=>touch[b.dataset.key]=false));
document.querySelectorAll('[data-action]').forEach(b=>bindButton(b,()=>{let a=b.dataset.action;if(a==='jump')jumpQueued=true;if(a==='attack')attackQueued=true;if(a==='power')powerQueued=true;if(a==='dash')dashQueued=true}));
addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(['ArrowLeft','ArrowRight','ArrowUp',' ','Shift'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key===' '||e.key==='ArrowUp'||k==='w')jumpQueued=true;if(k==='j'||k==='z')attackQueued=true;if(k==='k'||k==='x')powerQueued=true;if(e.key==='Shift')dashQueued=true;if(e.key==='Escape'&&mode==='play'){mode='pause';$('overlay').style.display='flex';$('hud').style.display='none';$('controls').style.display='none';$('panel').innerHTML='<div class="eyebrow">JORNADA PAUSADA</div><h1>NOCTARA<br><em>ESPERA</em></h1><button class="btn mainbtn" id="resume">CONTINUAR</button><button class="btn secondary" id="quit">SAIR PARA O MENU</button>';$('resume').onclick=()=>{mode='play';$('overlay').style.display='none';$('hud').style.display='flex';$('controls').style.display='flex'};$('quit').onclick=showMenu}});
addEventListener('keyup',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
addEventListener('blur',()=>{for(const k of Object.keys(keys))keys[k]=false;touch.left=touch.right=false;document.querySelectorAll('.controls button.down').forEach(b=>b.classList.remove('down'))});
function tick(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(mode==='play'){update(dt);if(jumpQueued)jump();if(attackQueued)attack();if(powerQueued)power();if(dashQueued)dash();jumpQueued=attackQueued=powerQueued=dashQueued=false}sceneTime+=dt;render();raf=requestAnimationFrame(tick)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'){mode='pause';$('overlay').style.display='flex';$('hud').style.display='none';$('controls').style.display='none';$('panel').innerHTML='<div class="eyebrow">JOGO PAUSADO</div><h1>VOLTE<br><em>À BATALHA</em></h1><button class="btn mainbtn" id="resume">CONTINUAR</button><button class="btn secondary" id="quit">MENU PRINCIPAL</button>';$('resume').onclick=()=>{mode='play';$('overlay').style.display='none';$('hud').style.display='flex';$('controls').style.display='flex'};$('quit').onclick=showMenu}});
showMenu();last=performance.now();raf=requestAnimationFrame(tick);
})();
</script></body></html>
