<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Click Rush | BlackLou Games</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b0a;color:#f4f7f1;font:16px system-ui;display:grid;place-items:center;padding:20px}.app{width:min(94vw,620px);text-align:center}.brand{color:#b7ff35;font-weight:900;letter-spacing:.12em}h1{margin:8px}.stats{display:flex;justify-content:space-around;color:#b7ff35;margin:16px}.arena{height:min(62vw,360px);min-height:260px;position:relative;overflow:hidden;border:1px solid #344533;border-radius:18px;background:radial-gradient(circle,#18251a,#0e1310)}.target{position:absolute;width:58px;height:58px;border:0;border-radius:50%;background:#b7ff35;color:#10150c;font-size:1.5rem;font-weight:900;cursor:pointer;box-shadow:0 0 25px #91e72c}.action,.back{display:inline-block;margin:18px 5px 0;border:0;border-radius:999px;padding:11px 18px;background:#b7ff35;color:#10150c;font-weight:900;text-decoration:none;cursor:pointer}.status{color:#9aa49c;min-height:24px}
</style></head><body><main class="app"><div class="brand">BLACKLOU GAMES</div><h1>⚡ Click Rush</h1><div class="stats"><span>Pontos: <b id="score">0</b></span><span>Tempo: <b id="time">20</b>s</span><span>Recorde: <b id="best">0</b></span></div><div class="arena" id="arena"><button class="target" id="target" hidden>+</button></div><p class="status" id="status">Acerte o alvo o máximo de vezes em 20 segundos.</p><button class="action" id="start">Começar</button><a class="back" href="../index.html">Outros jogos</a></main><script>
const arena=document.querySelector('#arena'),target=document.querySelector('#target');let score=0,time=20,playing=false,clock;let best=+(localStorage.clickRushBest||0);document.querySelector('#best').textContent=best;
function move(){const maxX=arena.clientWidth-58,maxY=arena.clientHeight-58;target.style.left=Math.random()*maxX+'px';target.style.top=Math.random()*maxY+'px'}
function finish(){playing=false;clearInterval(clock);target.hidden=true;if(score>best){best=score;localStorage.clickRushBest=best;document.querySelector('#best').textContent=best}document.querySelector('#status').textContent='Tempo esgotado! Você marcou '+score+' pontos.';document.querySelector('#start').textContent='Jogar novamente'}
document.querySelector('#start').onclick=()=>{if(playing)return;score=0;time=20;playing=true;target.hidden=false;document.querySelector('#score').textContent=score;document.querySelector('#time').textContent=time;document.querySelector('#status').textContent='Vai! Clique nos alvos.';document.querySelector('#start').textContent='Em andamento…';move();clock=setInterval(()=>{time--;document.querySelector('#time').textContent=time;if(time<=0)finish()},1000)};
target.onclick=()=>{if(!playing)return;score++;document.querySelector('#score').textContent=score;move()};
</script></body></html>
