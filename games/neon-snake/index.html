<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Snake | BlackLou Games</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b0a;color:#f4f7f1;font:16px system-ui;display:grid;place-items:center;padding:18px}.app{width:min(94vw,560px);text-align:center}.brand{color:#b7ff35;font-weight:900;letter-spacing:.12em}.brand:before{content:"🐆";margin-right:9px;filter:drop-shadow(0 0 7px #80ff32)}h1{margin:8px 0}.stats{display:flex;justify-content:space-between;color:#b7ff35;margin:12px 2px}canvas{width:100%;background:#101713;border:1px solid #344533;border-radius:16px;display:block;touch-action:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px}button,.back{border:0;border-radius:999px;padding:11px 18px;background:#b7ff35;color:#10150c;font-weight:900;cursor:pointer;text-decoration:none}.pad{display:grid;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center}.pad button{padding:10px}.hint{color:#9aa49c;font-size:.9rem}
</style></head><body><main class="app"><div class="brand">BLACKLOU GAMES</div><h1>🐍 Neon Snake</h1><div class="stats"><span>Pontos: <b id="score">0</b></span><span>Recorde: <b id="best">0</b></span></div><canvas id="game" width="480" height="480" aria-label="Tabuleiro do jogo"></canvas><div class="controls"><button id="start">Começar / Reiniciar</button><a class="back" href="../index.html">Outros jogos</a></div><div class="pad"><span></span><button data-d="up">▲</button><span></span><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><p class="hint">Use as setas do teclado ou os controles na tela. Colete os pontos verdes e não bata nas paredes ou em si mesmo.</p><p id="status" aria-live="polite">Toque em Começar para jogar.</p></main><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),N=20,S=24;let snake,food,dir,next,score,timer,alive=false;let best=+(localStorage.snakeBest||0);document.querySelector('#best').textContent=best;
function reset(){clearInterval(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;alive=true;food=spawn();update();document.querySelector('#status').textContent='Boa sorte!';timer=setInterval(tick,115)}
function spawn(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(a=>a.x===p.x&&a.y===p.y));return p}
function update(){document.querySelector('#score').textContent=score;x.fillStyle='#101713';x.fillRect(0,0,480,480);x.strokeStyle='#1d2a20';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,480);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(480,i*S);x.stroke()}x.fillStyle='#b7ff35';x.shadowColor='#b7ff35';x.shadowBlur=16;x.beginPath();x.arc(food.x*S+12,food.y*S+12,8,0,Math.PI*2);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?'#65b72a':'#d8ff8a';x.shadowColor='#b7ff35';x.shadowBlur=10;x.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)});x.shadowBlur=0}
function tick(){dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){end();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;food=spawn()}else snake.pop();update()}
function end(){clearInterval(timer);alive=false;document.querySelector('#status').textContent='Fim de jogo! Pontuação: '+score+'. Toque em Começar para tentar novamente.';if(score>best){best=score;localStorage.snakeBest=best;document.querySelector('#best').textContent=best}}
function turn(d){if(!alive)return;const v={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];if(v.x!==-dir.x||v.y!==-dir.y)next=v}
document.addEventListener('keydown',e=>{const k={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(k){e.preventDefault();turn(k)}});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>turn(b.dataset.d));document.querySelector('#start').onclick=reset;
// O tabuleiro só é desenhado depois de iniciar, evitando acessar snake/food ainda não inicializados.
x.fillStyle='#101713';x.fillRect(0,0,480,480);
</script></body></html>
