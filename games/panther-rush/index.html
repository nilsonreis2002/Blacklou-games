<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050806"><meta name="description" content="Panther Rush: corra, salte e sobreviva na arena neon da BlackLou Games."><title>Panther Rush — BlackLou Games</title>
<style>
:root{--g:#aaff19;--bg:#050806;--panel:#101810}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#243c18,#050806 65%);color:#f4f8ef;font:15px system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:14px}.shell{width:min(960px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}.brand{font-weight:1000;letter-spacing:.12em}.brand b{color:var(--g)}a{color:var(--g)}.hud{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#101a11;border:1px solid #3d592b;border-radius:9px;padding:7px 11px;font-weight:800;font-variant-numeric:tabular-nums}.stage{position:relative;border:2px solid #78b82a;border-radius:16px;overflow:hidden;background:#080d0b;box-shadow:0 0 35px #8dff2522}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#030704c9;text-align:center;padding:22px}.panel{max-width:440px}.panel h1{font-size:clamp(2rem,7vw,4rem);line-height:.95;margin:0 0 12px;text-transform:uppercase;font-weight:1000}.panel h1 span{color:var(--g)}.panel p{color:#c1cbbd}.btn{border:0;border-radius:999px;padding:13px 25px;background:linear-gradient(#d8ff83,#aaff19);color:#101708;font-weight:1000;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 #497d0e}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:12px}.ctrl{flex:1;max-width:180px;min-height:58px;border:1px solid #526e36;border-radius:13px;background:#111b12;color:var(--g);font-weight:1000;font-size:1rem;touch-action:none}.hint{color:#9ba996;text-align:center;font-size:.85rem;margin:10px 0}.hidden{display:none!important}@media(min-width:700px){.controls{justify-content:center}.ctrl{max-width:150px}}@media(max-width:520px){body{padding:9px}.stage{border-radius:10px}.controls{gap:8px}.ctrl{min-height:64px}}
</style></head><body><main class="shell"><header><a href="../../" class="brand" style="text-decoration:none">BLACKLOU <b>GAMES</b></a><div class="hud"><span class="pill">◆ <span id="score">0</span></span><span class="pill">CRISTAIS <span id="gems">0</span></span><span class="pill">RECORDE <span id="best">0</span></span></div></header>
<div class="stage"><canvas id="game" width="960" height="540" aria-label="Jogo Panther Rush"></canvas><div class="overlay" id="intro"><div class="panel"><div style="color:var(--g);letter-spacing:.25em;font-weight:900">BLACKLOU ORIGINAL</div><h1>PANTHER <span>RUSH</span></h1><p>Dispare pela arena neon, desvie das armadilhas e colete cristais. Salte duas vezes para escapar dos perigos.</p><button class="btn" id="start">INICIAR CORRIDA</button></div></div><div class="overlay hidden" id="over"><div class="panel"><h1>FIM DE <span>JOGO</span></h1><p id="result"></p><button class="btn" id="again">CORRER NOVAMENTE</button></div></div></div>
<div class="controls"><button class="ctrl" id="jump">↑ PULAR</button><button class="ctrl" id="dash">⚡ IMPULSO</button></div><p class="hint">Celular: use os botões • Computador: Espaço / ↑ para pular, Shift para impulso</p></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),$=id=>document.getElementById(id),W=960,H=540,floor=430;let running=false,raf=0,last=0,score=0,gems=0,speed=390,spawn=0,gemSpawn=0,obstacles=[],crystals=[],parts=[],best=+(localStorage.getItem('bl-rush-best')||0);$('best').textContent=best;
const p={x:145,y:floor-76,w:58,h:76,vy:0,jumps:0,shield:0,dash:0,inv:0};
function reset(){score=0;gems=0;speed=390;spawn=.8;gemSpawn=1;obstacles=[];crystals=[];parts=[];Object.assign(p,{y:floor-76,vy:0,jumps:0,shield:0,dash:0,inv:0});ui()}
function ui(){$('score').textContent=Math.floor(score);$('gems').textContent=gems}
function jump(){if(!running)return;if(p.jumps<2){p.vy=p.jumps===0?-760:-690;p.jumps++;burst(p.x+25,p.y+p.h,'#aaff19',8)}}
function dash(){if(running&&p.dash<=0){p.dash=1.05;p.inv=.42;burst(p.x+25,p.y+30,'#6ef7ff',15)}}
function burst(x0,y0,color,n){for(let i=0;i<n;i++)parts.push({x:x0,y:y0,vx:(Math.random()-.5)*260,vy:(Math.random()-.7)*230,t:.55,color})}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function end(){running=false;cancelAnimationFrame(raf);best=Math.max(best,Math.floor(score));localStorage.setItem('bl-rush-best',best);$('best').textContent=best;$('result').textContent='Pontuação: '+Math.floor(score)+' • Cristais: '+gems+' • Recorde: '+best;$('over').classList.remove('hidden')}
function start(){cancelAnimationFrame(raf);reset();running=true;$('intro').classList.add('hidden');$('over').classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop)}
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.032);last=now;update(dt);draw();raf=requestAnimationFrame(loop)}
function update(dt){score+=dt*(speed/35);speed=Math.min(760,390+score*1.15);spawn-=dt;gemSpawn-=dt;p.vy+=1900*dt;p.y+=p.vy*dt;if(p.y>=floor-p.h){p.y=floor-p.h;p.vy=0;p.jumps=0}p.shield=Math.max(0,p.shield-dt);p.dash=Math.max(0,p.dash-dt);p.inv=Math.max(0,p.inv-dt);
if(spawn<=0){let tall=Math.random()<.35;obstacles.push({x:W+20,y:floor-(tall?94:48),w:tall?48:54,h:tall?94:48,type:tall?'spike':'block'});spawn=Math.max(.72,1.45-Math.min(.55,score/180))+Math.random()*.5}
if(gemSpawn<=0){let yy=floor-105-Math.random()*145;for(let i=0;i<4;i++)crystals.push({x:W+30+i*48,y:yy-Math.sin(i/3*Math.PI)*22,r:12});gemSpawn=2.1+Math.random()*1.4}
for(let o of obstacles)o.x-=(speed*(p.dash>0?1.2:1))*dt;for(let g of crystals)g.x-=speed*dt;
obstacles=obstacles.filter(o=>o.x+o.w>0);crystals=crystals.filter(g=>g.x+g.r>0);
let hit={x:p.x+9,y:p.y+8,w:p.w-18,h:p.h-12};for(let o of obstacles)if(rect(hit,o)){if(p.shield>0||p.inv>0){o.x=-200;p.shield=0;burst(o.x,o.y,'#aaff19',12)}else{end();return}}
for(let i=crystals.length-1;i>=0;i--){let g=crystals[i];if(Math.hypot(g.x-(p.x+30),g.y-(p.y+34))<36){crystals.splice(i,1);gems++;score+=35;burst(g.x,g.y,'#65f7ff',8)}}
for(let a of parts){a.x+=a.vx*dt;a.y+=a.vy*dt;a.t-=dt}parts=parts.filter(a=>a.t>0);ui()}
function draw(){let grad=x.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#101e18');grad.addColorStop(1,'#050907');x.fillStyle=grad;x.fillRect(0,0,W,H);
for(let i=0;i<35;i++){let xx=(i*137-score*2.2%W+W)%W,yy=35+(i*71%290);x.fillStyle=i%3?'#aaff1933':'#7efaff55';x.fillRect(xx,yy,2,2)}
x.strokeStyle='#aaff1930';x.lineWidth=1;for(let i=0;i<10;i++){let xx=(i*120-score*1.1%120+W)%W;x.beginPath();x.moveTo(xx,0);x.lineTo(xx,floor);x.stroke()}
x.fillStyle='#172716';x.fillRect(0,floor,W,H-floor);x.fillStyle='#aaff19';x.fillRect(0,floor,W,4);x.strokeStyle='#577d2b';for(let i=0;i<18;i++){let xx=(i*75-score*4%75+W)%W;x.beginPath();x.moveTo(xx,floor+20);x.lineTo(xx-30,floor+110);x.stroke()}
for(let o of obstacles){x.fillStyle=o.type==='spike'?'#f04f68':'#b53c4f';x.shadowColor='#ff3155';x.shadowBlur=16;if(o.type==='spike'){x.beginPath();x.moveTo(o.x,o.y+o.h);x.lineTo(o.x+o.w/2,o.y);x.lineTo(o.x+o.w,o.y+o.h);x.fill()}else{x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#ff9aa7';x.fillRect(o.x+8,o.y+8,o.w-16,5)}x.shadowBlur=0}
for(let g of crystals){x.save();x.translate(g.x,g.y);x.rotate(Math.PI/4);x.fillStyle='#67f7ff';x.shadowColor='#67f7ff';x.shadowBlur=18;x.fillRect(-9,-9,18,18);x.restore();x.shadowBlur=0}
for(let a of parts){x.globalAlpha=Math.max(0,a.t*2);x.fillStyle=a.color;x.fillRect(a.x,a.y,5,5)}x.globalAlpha=1;
let blink=p.inv>0&&Math.floor(performance.now()/65)%2===0;x.save();if(blink)x.globalAlpha=.45;x.shadowColor='#aaff19';x.shadowBlur=20;x.fillStyle='#101610';x.strokeStyle='#aaff19';x.lineWidth=4;x.beginPath();x.moveTo(p.x+5,p.y+25);x.lineTo(p.x-3,p.y-4);x.lineTo(p.x+25,p.y+12);x.lineTo(p.x+48,p.y-3);x.lineTo(p.x+56,p.y+30);x.lineTo(p.x+52,p.y+65);x.lineTo(p.x+10,p.y+68);x.closePath();x.fill();x.stroke();x.shadowBlur=0;x.fillStyle='#aaff19';x.fillRect(p.x+15,p.y+26,11,5);x.fillRect(p.x+37,p.y+26,11,5);x.fillStyle='#050806';x.fillRect(p.x+19,p.y+26,3,5);x.fillRect(p.x+41,p.y+26,3,5);x.fillStyle='#d8e6d0';x.fillRect(p.x+28,p.y+43,8,5);x.fillStyle='#aaff19';x.fillRect(p.x+12,p.y+68,13,8);x.fillRect(p.x+39,p.y+68,13,8);x.restore();if(p.shield>0){x.strokeStyle='#68f7ff';x.lineWidth=4;x.beginPath();x.arc(p.x+29,p.y+36,48,0,Math.PI*2);x.stroke()}}
$('start').onclick=start;$('again').onclick=start;$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('dash').addEventListener('pointerdown',e=>{e.preventDefault();dash()});addEventListener('keydown',e=>{if(['Space','ArrowUp','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault();if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code.startsWith('Shift'))dash();if(!running&&e.code==='Enter')start()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)end()});draw();
})();
</script></body></html>
