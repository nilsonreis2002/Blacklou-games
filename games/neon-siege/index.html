<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Siege | BlackLou Games</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0a;color:#eff7eb;font:15px system-ui;display:grid;place-items:center;min-height:100vh;padding:14px}.app{width:min(96vw,900px)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{color:#b7ff35;font-weight:950;letter-spacing:.1em}a{color:#b7ff35}canvas{display:block;width:100%;border:1px solid #45613b;border-radius:14px;background:#08110f;touch-action:none;margin-top:12px}.bar{display:flex;gap:14px;flex-wrap:wrap;padding:10px 0;color:#caff70;font-weight:800}.buttons{display:flex;gap:8px;justify-content:center;margin-top:10px}.buttons button{background:#b7ff35;border:0;border-radius:9px;padding:10px 16px;font-weight:900}.mobile{display:none;justify-content:space-between;margin-top:10px}.mobile button{background:#17251a;color:#c5ff55;border:1px solid #527d3d;border-radius:12px;padding:14px 18px;font-size:1.2rem}@media(max-width:650px){.mobile{display:flex}}</style></head><body><main class="app"><header><div class="brand">BLACKLOU GAMES / NEON SIEGE</div><a href="../index.html">← Jogos</a></header><div class="bar">PONTOS: <b id="score">0</b>　VIDAS: <b id="lives">3</b>　ONDA: <b id="wave">1</b></div><canvas id="c" width="900" height="520"></canvas><div class="buttons"><button id="start">COMEÇAR / REINICIAR</button></div><div class="mobile"><button id="left">◀</button><button id="fire">✦ DISPARAR</button><button id="right">▶</button></div><p>← → para mover · Espaço para disparar · No celular use os controles abaixo.</p></main><script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let p,foes,bullets,eb,score,lives,wave,keys={},run=false,last=0,spawn=0;function reset(){p={x:430,y:455};foes=[];bullets=[];eb=[];score=0;lives=3;wave=1;spawn=0;run=true;hud()}function hud(){$('score').textContent=score;$('lives').textContent=lives;$('wave').textContent=wave}function draw(){let g=x.createLinearGradient(0,0,0,520);g.addColorStop(0,'#07121a');g.addColorStop(1,'#101b13');x.fillStyle=g;x.fillRect(0,0,900,520);for(let i=0;i<65;i++){x.fillStyle='#7cff48';x.globalAlpha=.35;x.fillRect((i*137)%900,(i*71+Date.now()/40)%520,2,2)}x.globalAlpha=1;x.fillStyle='#b7ff35';x.shadowColor='#b7ff35';x.shadowBlur=18;x.beginPath();x.moveTo(p.x,p.y-22);x.lineTo(p.x-23,p.y+18);x.lineTo(p.x,p.y+10);x.lineTo(p.x+23,p.y+18);x.fill();x.shadowBlur=0;foes.forEach(e=>{x.fillStyle='#a63855';x.beginPath();x.arc(e.x,e.y,17,0,7);x.fill();x.fillStyle='#ffdf75';x.fillRect(e.x-9,e.y-4,5,4);x.fillRect(e.x+5,e.y-4,5,4)});bullets.forEach(b=>{x.fillStyle='#c5ff55';x.fillRect(b.x-3,b.y-9,6,17)});eb.forEach(b=>{x.fillStyle='#ff5270';x.fillRect(b.x-4,b.y-7,8,14)});if(!run){x.fillStyle='#000a';x.fillRect(0,0,900,520);x.fillStyle='#c5ff55';x.textAlign='center';x.font='900 38px system-ui';x.fillText(lives?'NEON SIEGE':'FIM DE JOGO',450,240);x.fillStyle='white';x.font='18px system-ui';x.fillText('Toque em Começar para jogar',450,280)}}function tick(t){let d=Math.min(35,t-last);last=t;if(run){if(keys.left||keys.ArrowLeft)p.x-=6;if(keys.right||keys.ArrowRight)p.x+=6;p.x=Math.max(25,Math.min(875,p.x));if(keys.fire||keys.Space){if(!tick.cd||t-tick.cd>190){bullets.push({x:p.x,y:p.y-22});tick.cd=t}}spawn+=d;if(spawn>Math.max(350,1050-wave*45)){foes.push({x:30+Math.random()*840,y:-20,hp:1+Math.floor(wave/4)});spawn=0}bullets.forEach(b=>b.y-=9);eb.forEach(b=>b.y+=5);foes.forEach(e=>{e.y+=1.2+wave*.16;if(Math.random()<.004)eb.push({x:e.x,y:e.y+15})});bullets=bullets.filter(b=>b.y>0);eb=eb.filter(b=>b.y<530);foes=foes.filter(e=>{let hit=bullets.findIndex(b=>Math.abs(b.x-e.x)<20&&Math.abs(b.y-e.y)<20);if(hit>=0){bullets.splice(hit,1);e.hp--;if(e.hp<=0){score+=10;return false}}if(e.y>520){lives--;return false}return true});eb=eb.filter(b=>{if(Math.abs(b.x-p.x)<20&&Math.abs(b.y-p.y)<22){lives--;return false}return true});wave=1+Math.floor(score/100);if(lives<=0)run=false;hud()}draw();requestAnimationFrame(tick)}$('start').onclick=reset;window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.code]=false);[['left','left'],['right','right'],['fire','fire']].forEach(([id,k])=>{let b=$(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});reset();run=false;tick(0)})();
</script></body></html>
