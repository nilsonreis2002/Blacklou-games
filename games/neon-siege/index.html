<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Siege | BlackLou Games</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0a;color:#eff7eb;font:15px system-ui;display:grid;place-items:center;min-height:100vh;padding:14px}.app{width:min(96vw,900px)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{color:#b7ff35;font-weight:950;letter-spacing:.1em}a{color:#b7ff35}canvas{display:block;width:100%;border:1px solid #45613b;border-radius:14px;background:#08110f;touch-action:none;margin-top:12px}.bar{display:flex;gap:14px;flex-wrap:wrap;padding:10px 0;color:#caff70;font-weight:800}.buttons{display:flex;gap:8px;justify-content:center;margin-top:10px}.buttons button{background:#b7ff35;border:0;border-radius:9px;padding:10px 16px;font-weight:900}.mobile{display:none;justify-content:space-between;margin-top:10px}.mobile button{background:#17251a;color:#c5ff55;border:1px solid #527d3d;border-radius:12px;padding:14px 18px;font-size:1.2rem}@media(max-width:650px){.mobile{display:flex}}</style></head><body><main class="app"><header><div class="brand">BLACKLOU GAMES / NEON SIEGE</div><a href="../index.html">← Jogos</a></header><div class="bar">PONTOS: <b id="score">0</b>　VIDAS: <b id="lives">3</b>　ONDA: <b id="wave">1</b>　<span id="status">Prepare-se para a batalha.</span></div><div style="height:7px;background:#26352a;border-radius:9px;overflow:hidden"><div id="bossHealth" style="height:100%;width:0;background:linear-gradient(90deg,#ff315d,#ffb04b);transition:width .15s"></div></div><canvas id="c" width="900" height="520"></canvas><div class="buttons"><button id="start">COMEÇAR / REINICIAR</button></div><div class="mobile"><button id="left">◀</button><button id="fire">✦ DISPARAR</button><button id="right">▶</button></div><p>← → para mover · Espaço para disparar · No celular use os controles abaixo.</p></main><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let p,foes,bullets,enemyShots,drops,score,lives,wave,keys={},run=false,last=0,spawn=0,boss=null,rapid=0,shield=0,shake=0,fireAt=0;const W=900,H=520;
function reset(){p={x:450,y:455};foes=[];bullets=[];enemyShots=[];drops=[];score=0;lives=3;wave=1;spawn=0;boss=null;rapid=0;shield=0;shake=0;fireAt=0;run=true;hud()}
function hud(){$('score').textContent=score;$('lives').textContent=lives;$('wave').textContent=wave;let el=$('bossHealth');if(el)el.style.width=boss?(boss.hp/boss.max*100)+'%':'0%'}
function makeBoss(){boss={x:450,y:90,hp:90+wave*12,max:90+wave*12,dir:1,shot:0};$('status').textContent='CHEFE DA ONDA '+wave+' — ATAQUE!'}
function drop(x,y){if(Math.random()<.2)drops.push({x,y,type:['rapid','shield','heart'][Math.floor(Math.random()*3)],r:11})}
function draw(){x.save();if(shake){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;if(shake<.3)shake=0}let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07121a');g.addColorStop(1,'#101b13');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<85;i++){x.fillStyle='#7cff48';x.globalAlpha=.2+(i%3)*.08;x.fillRect((i*137)%W,(i*71+Date.now()/45)%H,2,2)}x.globalAlpha=1;
if(shield>0){x.strokeStyle='#74dcff';x.lineWidth=4;x.shadowColor='#55cfff';x.shadowBlur=20;x.beginPath();x.arc(p.x,p.y,34,0,Math.PI*2);x.stroke();x.shadowBlur=0}
x.fillStyle='#b7ff35';x.shadowColor='#b7ff35';x.shadowBlur=18;x.beginPath();x.moveTo(p.x,p.y-24);x.lineTo(p.x-24,p.y+19);x.lineTo(p.x,p.y+10);x.lineTo(p.x+24,p.y+19);x.fill();x.shadowBlur=0;
foes.forEach(e=>{x.fillStyle=e.type==='tank'?'#9c4aff':e.type==='swift'?'#ff9b35':'#a63855';x.beginPath();x.arc(e.x,e.y,e.r,0,Math.PI*2);x.fill();x.fillStyle='#ffdf75';x.fillRect(e.x-9,e.y-4,5,4);x.fillRect(e.x+5,e.y-4,5,4);if(e.hp>1){x.fillStyle='#222';x.fillRect(e.x-15,e.y-e.r-9,30,4);x.fillStyle='#b7ff35';x.fillRect(e.x-15,e.y-e.r-9,30*e.hp/e.max,4)}});
if(boss){x.fillStyle='#5d1027';x.beginPath();x.moveTo(boss.x,boss.y-44);x.lineTo(boss.x+44,boss.y-18);x.lineTo(boss.x+35,boss.y+28);x.lineTo(boss.x,boss.y+45);x.lineTo(boss.x-35,boss.y+28);x.lineTo(boss.x-44,boss.y-18);x.closePath();x.fill();x.strokeStyle='#ff5270';x.lineWidth=4;x.stroke();x.fillStyle='#fff';x.fillRect(boss.x-20,boss.y-8,10,6);x.fillRect(boss.x+10,boss.y-8,10,6)}
bullets.forEach(b=>{x.fillStyle='#c5ff55';x.shadowColor='#b7ff35';x.shadowBlur=12;x.fillRect(b.x-3,b.y-9,6,17)});x.shadowBlur=0;
enemyShots.forEach(b=>{x.fillStyle='#ff5270';x.beginPath();x.arc(b.x,b.y,5,0,Math.PI*2);x.fill()});
drops.forEach(d=>{x.fillStyle=d.type==='rapid'?'#ffe66d':d.type==='shield'?'#63d9ff':'#ff7a9b';x.shadowColor=x.fillStyle;x.shadowBlur=15;x.beginPath();x.arc(d.x,d.y,d.r,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#101510';x.font='bold 13px system-ui';x.textAlign='center';x.fillText(d.type==='rapid'?'R':d.type==='shield'?'S':'+',d.x,d.y+5)});
if(!run){x.fillStyle='#000a';x.fillRect(0,0,W,H);x.fillStyle='#c5ff55';x.textAlign='center';x.font='900 38px system-ui';x.fillText(lives?'NEON SIEGE':'FIM DE JOGO',450,240);x.fillStyle='white';x.font='18px system-ui';x.fillText('Pontuação: '+score+' • Toque em Começar',450,280)}x.restore()}
function shoot(t){if(t-fireAt<(rapid>0?95:210))return;fireAt=t;bullets.push({x:p.x-9,y:p.y-18,dy:10},{x:p.x+9,y:p.y-18,dy:10})}
function tick(t){let d=Math.min(35,t-last||16);last=t;if(run){if(keys.left||keys.ArrowLeft)p.x-=7*d/16;if(keys.right||keys.ArrowRight)p.x+=7*d/16;p.x=Math.max(25,Math.min(875,p.x));if(keys.fire||keys.Space)shoot(t);rapid=Math.max(0,rapid-d);shield=Math.max(0,shield-d);
spawn+=d;if(!boss&&spawn>Math.max(330,1050-wave*42)){let type=Math.random()<.18?'tank':Math.random()<.45?'swift':'grunt',max=type==='tank'?3+Math.floor(wave/3):1;foes.push({x:35+Math.random()*830,y:-25,hp:max,max,r:type==='tank'?22:type==='swift'?13:17,type,phase:Math.random()*6});spawn=0}
bullets.forEach(b=>b.y-=b.dy);enemyShots.forEach(b=>b.y+=b.dy);foes.forEach(e=>{e.y+=(e.type==='swift'?2.4:1.25)+wave*.12;e.x+=e.type==='swift'?Math.sin(t/180+e.phase)*2:Math.sin(t/480+e.phase)*.35;if(Math.random()<.0025+wave*.0002)enemyShots.push({x:e.x,y:e.y+15,dy:4+wave*.12})});
bullets=bullets.filter(b=>b.y>-20);enemyShots=enemyShots.filter(b=>b.y<H+10);
for(let i=foes.length-1;i>=0;i--){let e=foes[i],hit=bullets.findIndex(b=>Math.abs(b.x-e.x)<e.r+5&&Math.abs(b.y-e.y)<e.r+8);if(hit>=0){bullets.splice(hit,1);e.hp--;if(e.hp<=0){score+=e.type==='tank'?25:10;drop(e.x,e.y);foes.splice(i,1);if(score>0&&score%150<25){wave=1+Math.floor(score/150);if(wave%5===0&&!boss)makeBoss()}}}else if(e.y>H-8){foes.splice(i,1);lives--;shake=8}}
if(boss){boss.x+=boss.dir*(1.8+wave*.08);if(boss.x>820||boss.x<80)boss.dir*=-1;boss.shot+=d;if(boss.shot>600){enemyShots.push({x:boss.x-20,y:boss.y+35,dy:5},{x:boss.x,y:boss.y+35,dy:5.8},{x:boss.x+20,y:boss.y+35,dy:5});boss.shot=0}let hit=bullets.findIndex(b=>Math.abs(b.x-boss.x)<48&&Math.abs(b.y-boss.y)<48);if(hit>=0){bullets.splice(hit,1);boss.hp-=2;if(boss.hp<=0){score+=250;drop(boss.x,boss.y);boss=null;wave++;$('status').textContent='CHEFE DERROTADO! Próxima onda: '+wave;}}
}
drops.forEach(d=>d.y+=2);drops=drops.filter(d=>{if(Math.hypot(d.x-p.x,d.y-p.y)<34){if(d.type==='rapid')rapid=6500;if(d.type==='shield')shield=6500;if(d.type==='heart')lives=Math.min(5,lives+1);return false}return d.y<H+20});
enemyShots=enemyShots.filter(b=>{if(Math.hypot(b.x-p.x,b.y-p.y)<23){if(shield<=0){lives--;shake=12}return false}return true});
if(lives<=0)run=false;hud()}draw();requestAnimationFrame(tick)}
$('start').onclick=reset;window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.code]=false);[['left','left'],['right','right'],['fire','fire']].forEach(([id,k])=>{let b=$(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});reset();run=false;tick(0)})();</script></body></html>
