<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cyber Drift | BlackLou Games</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0a;color:#f3f8ef;font:15px system-ui;display:grid;place-items:center;min-height:100vh;padding:14px}.app{width:min(96vw,760px)}header{display:flex;justify-content:space-between;flex-wrap:wrap}.brand{color:#b7ff35;font-weight:950;letter-spacing:.1em}a{color:#b7ff35}.stats{padding:10px;color:#c5ff55;font-weight:900}canvas{display:block;width:100%;background:#101713;border:1px solid #52733e;border-radius:14px;touch-action:none}.controls{display:flex;justify-content:center;gap:10px;margin:12px}.controls button{background:#b7ff35;border:0;border-radius:10px;padding:12px 24px;font-weight:900}.mobile{display:none;justify-content:space-between}.mobile button{background:#17251a;color:#c5ff55;border:1px solid #527d3d;border-radius:12px;padding:14px 25px;font-size:1.2rem}@media(max-width:650px){.mobile{display:flex}}</style></head><body><main class="app"><header><div class="brand">BLACKLOU GAMES / CYBER DRIFT</div><a href="../index.html">← Jogos</a></header><div class="stats">DISTÂNCIA: <b id="score">0</b> m　　MELHOR: <b id="best">0</b> m　　VIDAS: <b id="lives">3</b>　　ESCUDOS: <b id="coins">0</b></div><canvas id="c" width="720" height="520"></canvas><div class="controls"><button id="start">LARGAR / REINICIAR</button></div><div class="mobile"><button id="left">◀</button><button id="right">▶</button></div><p>Desvie dos obstáculos e sobreviva o máximo possível. Use ← → ou os botões no celular.</p></main><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let car,obs,items,dist,speed,run,keys={},last=0,lives,shield,invuln,shake,spawn,coins;let best=+(localStorage.cyberDrift||0);$('best').textContent=best;
function reset(){car=330;obs=[];items=[];dist=0;speed=5;run=true;last=0;lives=3;shield=0;invuln=0;shake=0;spawn=0;coins=0;hud()}
function hud(){$('score').textContent=Math.floor(dist);$('best').textContent=best;let l=$('lives');if(l)l.textContent=lives;let s=$('coins');if(s)s.textContent=coins}
function spawnObstacle(){let lane=Math.floor(Math.random()*3),type=Math.random()<.28?'truck':'car';obs.push({x:120+lane*160,y:-100,w:type==='truck'?62:54,h:type==='truck'?96:72,type,passed:false})}
function drawCar(px,py,color){x.fillStyle=color;x.shadowColor=color;x.shadowBlur=13;x.beginPath();x.roundRect(px,py,58,78,10);x.fill();x.shadowBlur=0;x.fillStyle='#101510';x.fillRect(px+9,py+12,40,20);x.fillStyle='#d9e7d3';x.fillRect(px+7,py+5,10,6);x.fillRect(px+41,py+5,10,6);x.fillStyle='#ff4c5f';x.fillRect(px+7,py+65,10,6);x.fillRect(px+41,py+65,10,6)}
function draw(){x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82}x.fillStyle='#101813';x.fillRect(0,0,720,520);x.fillStyle='#29372b';x.fillRect(100,0,520,520);x.fillStyle='#19231b';x.fillRect(108,0,8,520);x.fillRect(604,0,8,520);x.strokeStyle='#d4ff9a';x.lineWidth=5;x.setLineDash([35,28]);x.lineDashOffset=-dist%63;x.beginPath();x.moveTo(273,0);x.lineTo(273,520);x.moveTo(447,0);x.lineTo(447,520);x.stroke();x.setLineDash([]);
obs.forEach(o=>drawCar(o.x,o.y,o.type==='truck'?'#a64bdb':'#f04f6a'));
items.forEach(o=>{x.fillStyle='#69eaff';x.shadowColor='#69eaff';x.shadowBlur=20;x.beginPath();x.arc(o.x,o.y,13,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#08212a';x.font='bold 14px system-ui';x.textAlign='center';x.fillText('S',o.x,o.y+5)});
if(shield>0||invuln>0){x.strokeStyle=shield>0?'#69eaff':'#c5ff55';x.lineWidth=4;x.shadowColor=x.strokeStyle;x.shadowBlur=20;x.beginPath();x.arc(car+29,459,43,0,Math.PI*2);x.stroke();x.shadowBlur=0}
drawCar(car,420,'#b7ff35');
if(!run){x.fillStyle='#000b';x.fillRect(0,0,720,520);x.fillStyle='#c5ff55';x.textAlign='center';x.font='900 38px system-ui';x.fillText('CORRIDA ENCERRADA',360,225);x.fillStyle='white';x.font='18px system-ui';x.fillText('Distância: '+Math.floor(dist)+' m  •  Cristais: '+coins,360,265);x.fillText('Toque em Largar para tentar novamente',360,298)}x.restore()}
function crash(){if(invuln>0)return;if(shield>0){shield=0;invuln=900;shake=8;return}lives--;invuln=1300;shake=15;if(lives<=0)run=false;hud()}
function loop(t){if(!last)last=t;let dt=Math.min(35,t-last);last=t;if(run){if(keys.left||keys.ArrowLeft)car-=7*dt/16;if(keys.right||keys.ArrowRight)car+=7*dt/16;car=Math.max(112,Math.min(550,car));dist+=speed*dt/16;speed=Math.min(15,5+dist/850);shield=Math.max(0,shield-dt);invuln=Math.max(0,invuln-dt);spawn+=dt;if(spawn>Math.max(380,1000-speed*35)){spawnObstacle();if(Math.random()<.22)items.push({x:145+Math.floor(Math.random()*3)*160,y:-160});spawn=0}
obs.forEach(o=>o.y+=(speed+(o.type==='truck'?-.6:0))*dt/16);obs=obs.filter(o=>{if(o.y>530)return false;if(o.y+o.h>420&&o.y<498&&o.x<car+58&&o.x+o.w>car){crash();o.y=540}return true});
items=items.filter(o=>{o.y+=(speed+1)*dt/16;if(Math.hypot(o.x-(car+29),o.y-459)<44){shield=5500;coins++;hud();return false}return o.y<540});
if(Math.floor(dist)>best){best=Math.floor(dist);localStorage.cyberDrift=best}hud()}draw();requestAnimationFrame(loop)}
$('start').onclick=reset;window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.code]=false);[['left','left'],['right','right']].forEach(([id,k])=>{let b=$(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});reset();requestAnimationFrame(loop)})();</script></body></html>
