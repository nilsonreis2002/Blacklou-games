<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cyber Drift | BlackLou Games</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0a;color:#f3f8ef;font:15px system-ui;display:grid;place-items:center;min-height:100vh;padding:14px}.app{width:min(96vw,760px)}header{display:flex;justify-content:space-between;flex-wrap:wrap}.brand{color:#b7ff35;font-weight:950;letter-spacing:.1em}a{color:#b7ff35}.stats{padding:10px;color:#c5ff55;font-weight:900}canvas{display:block;width:100%;background:#101713;border:1px solid #52733e;border-radius:14px;touch-action:none}.controls{display:flex;justify-content:center;gap:10px;margin:12px}.controls button{background:#b7ff35;border:0;border-radius:10px;padding:12px 24px;font-weight:900}.mobile{display:none;justify-content:space-between}.mobile button{background:#17251a;color:#c5ff55;border:1px solid #527d3d;border-radius:12px;padding:14px 25px;font-size:1.2rem}@media(max-width:650px){.mobile{display:flex}}</style></head><body><main class="app"><header><div class="brand">BLACKLOU GAMES / CYBER DRIFT</div><a href="../index.html">← Jogos</a></header><div class="stats">DISTÂNCIA: <b id="score">0</b> m　　MELHOR: <b id="best">0</b> m</div><canvas id="c" width="720" height="520"></canvas><div class="controls"><button id="start">LARGAR / REINICIAR</button></div><div class="mobile"><button id="left">◀</button><button id="right">▶</button></div><p>Desvie dos obstáculos e sobreviva o máximo possível. Use ← → ou os botões no celular.</p></main><script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let car,obs,dist,speed,run,keys={},last=0;let best=+(localStorage.cyberDrift||0);$('best').textContent=best;function reset(){car=330;obs=[];dist=0;speed=5;run=true;last=0}function draw(){x.fillStyle='#101813';x.fillRect(0,0,720,520);x.fillStyle='#29372b';x.fillRect(100,0,520,520);x.strokeStyle='#d4ff9a';x.lineWidth=5;x.setLineDash([35,28]);x.lineDashOffset=-dist%63;x.beginPath();x.moveTo(273,0);x.lineTo(273,520);x.moveTo(447,0);x.lineTo(447,520);x.stroke();x.setLineDash([]);x.fillStyle='#b7ff35';x.shadowColor='#b7ff35';x.shadowBlur=18;x.fillRect(car,420,58,78);x.fillStyle='#101510';x.fillRect(car+9,433,40,19);x.shadowBlur=0;obs.forEach(o=>{x.fillStyle='#f04f6a';x.fillRect(o.x,o.y,54,58);x.fillStyle='#ffd5dc';x.fillRect(o.x+8,o.y+8,38,8)});if(!run){x.fillStyle='#000b';x.fillRect(0,0,720,520);x.fillStyle='#c5ff55';x.textAlign='center';x.font='900 38px system-ui';x.fillText('CORRIDA ENCERRADA',360,240);x.fillStyle='white';x.font='18px system-ui';x.fillText('Toque em Largar para tentar novamente',360,280)}}function loop(t){if(!last)last=t;let dt=Math.min(32,t-last);last=t;if(run){if(keys.left||keys.ArrowLeft)car-=7;if(keys.right||keys.ArrowRight)car+=7;car=Math.max(112,Math.min(550,car));dist+=speed*dt/16;speed=Math.min(13,5+dist/900);if(Math.random()<.035+speed*.001)obs.push({x:120+Math.floor(Math.random()*3)*160,y:-70});obs.forEach(o=>o.y+=speed*dt/16);obs=obs.filter(o=>{if(o.y>520)return false;if(o.y+58>420&&o.y<498&&o.x<car+58&&o.x+54>car){run=false}return true});$('score').textContent=Math.floor(dist);if(Math.floor(dist)>best){best=Math.floor(dist);localStorage.cyberDrift=best;$('best').textContent=best}}draw();requestAnimationFrame(loop)}$('start').onclick=reset;window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.code]=false);[['left','left'],['right','right']].forEach(([id,k])=>{let b=$(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});reset();requestAnimationFrame(loop)})();
</script></body></html>
