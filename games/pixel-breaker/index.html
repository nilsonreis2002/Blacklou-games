<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b0a"><title>Pixel Breaker | BlackLou Games</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b0a;color:#f5f8f3;font:16px system-ui;display:grid;place-items:center;padding:18px}.app{width:min(94vw,620px);text-align:center}.brand{color:#b7ff35;font-weight:950;letter-spacing:.13em}.brand:before{content:"🐆";margin-right:9px;filter:drop-shadow(0 0 7px #80ff32)}h1{margin:8px 0}.stats{display:flex;justify-content:space-around;gap:10px;color:#b7ff35;margin:14px 0}.board{width:100%;background:#101713;border:1px solid #344533;border-radius:16px;display:block;touch-action:none}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:14px}.action,.back{border:0;border-radius:999px;padding:11px 18px;background:#b7ff35;color:#10150c;font-weight:900;cursor:pointer;text-decoration:none}.hint{color:#a2ada4;font-size:.9rem}.status{min-height:25px;color:#d9e8d2}
</style></head><body><main class="app"><div class="brand">BLACKLOU GAMES</div><h1>🧱 Pixel Breaker</h1><div class="stats"><span>Pontos: <b id="score">0</b></span><span>Vidas: <b id="lives">3</b></span><span>Recorde: <b id="best">0</b></span></div><canvas id="board" class="board" width="600" height="440" aria-label="Jogo de quebrar blocos"></canvas><div class="controls"><button class="action" id="start">Começar / Reiniciar</button><a class="back" href="../index.html">Outros jogos</a></div><p class="hint">Mova a plataforma com as setas, A/D ou arrastando o dedo sobre o jogo. No celular, também pode tocar nos lados do tabuleiro.</p><p class="status" id="status" aria-live="polite">Toque em Começar para jogar.</p></main>
<script>
const c=document.getElementById('board'),ctx=c.getContext('2d'),W=c.width,H=c.height;let paddle,ball,bricks,score=0,lives=3,playing=false,raf=0,keys={},best=+(localStorage.pixelBreakerBest||0),last=0;
document.getElementById('best').textContent=best;
function makeBricks(){bricks=[];for(let r=0;r<5;r++)for(let col=0;col<9;col++)bricks.push({x:25+col*61,y:48+r*27,w:52,h:16,on:true})}
function reset(){cancelAnimationFrame(raf);score=0;lives=3;paddle={x:250,y:405,w:100,h:12,speed:7};ball={x:300,y:380,dx:3.2,dy:-3.7,r:7};makeBricks();playing=true;last=0;sync();document.getElementById('status').textContent='Boa sorte! Destrua todos os blocos.';raf=requestAnimationFrame(loop)}
function sync(){document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives}
function draw(){ctx.fillStyle='#101713';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1d2a20';for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}bricks.forEach((b,i)=>{if(!b.on)return;ctx.fillStyle=['#b7ff35','#8be34a','#65c85a','#46a98b','#398e9a'][Math.floor(i/9)];ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#101713';ctx.strokeRect(b.x,b.y,b.w,b.h)});ctx.fillStyle='#d8ff8a';ctx.shadowColor='#b7ff35';ctx.shadowBlur=14;ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
function finish(won){playing=false;cancelAnimationFrame(raf);document.getElementById('status').textContent=won?'Você venceu! Todos os blocos foram destruídos.':'Fim de jogo! Tente novamente.';if(score>best){best=score;localStorage.pixelBreakerBest=best;document.getElementById('best').textContent=best}}
function loop(t){if(!playing)return;const dt=Math.min((t-last||16)/16,2);last=t;if(keys.ArrowLeft||keys.a||keys.A)paddle.x-=paddle.speed*dt;if(keys.ArrowRight||keys.d||keys.D)paddle.x+=paddle.speed*dt;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));ball.x+=ball.dx*dt;ball.y+=ball.dy*dt;if(ball.x<ball.r||ball.x>W-ball.r)ball.dx*=-1;if(ball.y<ball.r)ball.dy=Math.abs(ball.dy);if(ball.dy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.dy=-Math.abs(ball.dy);ball.dx=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*4.5}for(const b of bricks){if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y-ball.r<b.y+b.h&&ball.y+ball.r>b.y){b.on=false;ball.dy*=-1;score+=10;sync();break}}if(ball.y>H){lives--;sync();if(lives<=0){finish(false);draw();return}ball.x=300;ball.y=370;ball.dx=3.2;ball.dy=-3.7}if(bricks.every(b=>!b.on)){finish(true);draw();return}draw();raf=requestAnimationFrame(loop)}
document.getElementById('start').onclick=reset;document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();keys[e.key]=true});document.addEventListener('keyup',e=>keys[e.key]=false);
function pointer(e){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2))}c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});c.addEventListener('pointerdown',e=>{pointer(e);if(!playing)reset()});makeBricks();paddle={x:250,y:405,w:100,h:12};ball={x:300,y:380,dx:0,dy:0,r:7};draw();
</script></body></html>
