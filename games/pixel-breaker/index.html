<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b0a"><meta name="description" content="Pixel Breaker: destrua blocos, enfrente chefes e conquiste recordes na arena BlackLou."><title>Pixel Breaker | BlackLou Games</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#263d1d,#080b0a 55%);color:#f5f8f3;font:16px system-ui;display:grid;place-items:center;padding:16px}.app{width:min(96vw,760px);text-align:center}.brand{color:#b7ff35;font-weight:950;letter-spacing:.15em}.brand:before{content:"🐆 ";filter:drop-shadow(0 0 8px #8cff32)}h1{margin:5px 0 12px;font-size:clamp(2rem,6vw,3rem);text-transform:uppercase;font-weight:1000;text-shadow:0 4px #26371d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{background:#111a13;border:1px solid #344b2b;border-radius:10px;padding:8px;color:#aaff35}.stat b{display:block;color:#fff;font-size:1.15rem}.bossbar{height:9px;background:#291414;border-radius:20px;overflow:hidden;margin:8px 0 12px;display:none}.bossbar span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3939,#ff9b36)}canvas{width:100%;height:auto;display:block;background:#090f0b;border:2px solid #557c31;border-radius:14px;touch-action:none;box-shadow:0 12px 38px #0009}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:13px}.action,.back{border:0;border-radius:999px;padding:11px 18px;background:linear-gradient(#d9ff8d,#aaff35);color:#10150c;font-weight:950;text-decoration:none;cursor:pointer}.hint,.status{color:#a2ada4;font-size:.9rem}.status{min-height:24px;color:#d9e8d2}.touch{display:flex;justify-content:space-between;gap:14px;max-width:440px;margin:0 auto}.touch button{width:50%;font-size:1.35rem;padding:13px;border:1px solid #638d37;border-radius:12px;background:#172318;color:#b7ff35;touch-action:none}@media(min-width:760px){.touch{display:none}}
</style></head><body><main class="app"><div class="brand">BLACKLOU GAMES</div><h1>🧱 Pixel Breaker</h1><div class="stats"><div class="stat">PONTOS<b id="score">0</b></div><div class="stat">VIDAS<b id="lives">3</b></div><div class="stat">FASE<b id="stage">1/5</b></div><div class="stat">RECORDE<b id="best">0</b></div></div><div class="bossbar" id="bossbar"><span id="bossfill"></span></div><canvas id="board" width="720" height="520" aria-label="Tabuleiro Pixel Breaker"></canvas><div class="controls"><button class="action" id="start">COMEÇAR / REINICIAR</button><a class="back" href="../index.html">OUTROS JOGOS</a></div><div class="touch"><button id="left">◀</button><button id="right">▶</button></div><p class="hint">Setas, A/D ou arraste a plataforma. No celular, use os botões ou toque no tabuleiro. Pegue os bônus e destrua o núcleo do chefe!</p><p class="status" id="status" aria-live="polite">Prepare-se para a arena. Toque em Começar.</p></main>
<script>
const c=document.querySelector('#board'),g=c.getContext('2d'),W=c.width,H=c.height,$=id=>document.getElementById(id);let p,b,blocks=[],drops=[],score=0,lives=3,stage=1,playing=false,raf=0,last=0,keys={},bossHP=0,boss=null,wide=0,slow=0;
let best=+(localStorage.getItem('pixelBreakerBest')||0);$('best').textContent=best;
function makeStage(){blocks=[];drops=[];boss=null;bossHP=0;$('bossbar').style.display='none';let rows=stage===5?4:Math.min(3+stage,6),cols=10;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(stage===5&&y===0&&x>2&&x<7)continue;blocks.push({x:32+x*66,y:58+y*27,w:56,h:17,hp:stage>=3&&Math.random()<.24?2:1,max:1})}if(stage===5){boss={x:230,y:28,w:260,h:26,dir:2};bossHP=24;$('bossbar').style.display='block'}resetBall()}
function resetBall(){p={x:310,y:478,w:100,h:13,speed:8};b={x:360,y:455,dx:(Math.random()<.5?-1:1)*3.4,dy:-4.5,r:8}}
function start(){cancelAnimationFrame(raf);score=0;lives=3;stage=1;wide=0;slow=0;playing=true;makeStage();sync();$('status').textContent='Destrua os blocos! Bônus: +plataforma, vida e bola lenta.';last=0;raf=requestAnimationFrame(loop)}
function sync(){$('score').textContent=score;$('lives').textContent=lives;$('stage').textContent=stage+'/5';$('bossfill').style.width=(bossHP/24*100)+'%'}
function end(win){playing=false;cancelAnimationFrame(raf);$('status').textContent=win?'VITÓRIA! Você dominou as cinco arenas!':'Fim de jogo. A arena espera sua revanche.';if(score>best){best=score;localStorage.setItem('pixelBreakerBest',best);$('best').textContent=best}}
function spawn(x,y){if(Math.random()<.19)drops.push({x,y,r:10,type:['wide','life','slow'][Math.floor(Math.random()*3)],dy:2})}
function draw(){g.fillStyle='#09110c';g.fillRect(0,0,W,H);for(let x=0;x<W;x+=36){g.strokeStyle='#18251a';g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}blocks.forEach(q=>{g.fillStyle=q.hp===2?'#ff9d35':['#b7ff35','#8be34a','#55c98a','#36a9a0','#a66bff'][(Math.floor(q.y/27))%5];g.shadowColor=g.fillStyle;g.shadowBlur=8;g.fillRect(q.x,q.y,q.w,q.h);g.shadowBlur=0});if(boss){g.fillStyle='#ff4a43';g.shadowColor='#ff3333';g.shadowBlur=18;g.fillRect(boss.x,boss.y,boss.w,boss.h);g.fillStyle='#fff';g.fillRect(boss.x+boss.w/2-8,boss.y+7,16,8);g.shadowBlur=0}drops.forEach(d=>{g.fillStyle=d.type==='life'?'#ff5d75':d.type==='wide'?'#b7ff35':'#62caff';g.beginPath();g.arc(d.x,d.y,d.r,0,7);g.fill();g.fillStyle='#071008';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText(d.type==='life'?'♥':d.type==='wide'?'W':'S',d.x,d.y+4)});g.fillStyle='#d9ff91';g.shadowColor='#aaff35';g.shadowBlur=16;g.fillRect(p.x,p.y,p.w,p.h);g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();g.shadowBlur=0}
function loop(t){if(!playing)return;let dt=Math.min((t-last||16)/16,2);last=t;if(keys.left)p.x-=p.speed*dt;if(keys.right)p.x+=p.speed*dt;p.x=Math.max(0,Math.min(W-p.w,p.x));b.x+=b.dx*dt;b.y+=b.dy*dt;if(b.x<b.r||b.x>W-b.r)b.dx*=-1;if(b.y<b.r)b.dy=Math.abs(b.dy);if(b.dy>0&&b.y+b.r>=p.y&&b.y-b.r<=p.y+p.h&&b.x>=p.x&&b.x<=p.x+p.w){b.dy=-Math.abs(b.dy);b.dx=((b.x-(p.x+p.w/2))/(p.w/2))*5.5}for(const q of blocks){if(q.hp&&b.x>q.x&&b.x<q.x+q.w&&b.y+b.r>q.y&&b.y-b.r<q.y+q.h){q.hp--;b.dy*=-1;score+=10;spawn(q.x+q.w/2,q.y);break}}if(boss){boss.x+=boss.dir*dt;if(boss.x<20||boss.x+boss.w>W-20)boss.dir*=-1;if(b.y<boss.y+boss.h&&b.x>boss.x&&b.x<boss.x+boss.w&&b.dy<0){bossHP--;b.dy=Math.abs(b.dy);score+=25;sync();if(bossHP<=0){boss=null;$('bossbar').style.display='none'}}}drops=drops.filter(d=>{d.y+=d.dy*dt;if(d.y>p.y&&d.y<p.y+p.h+10&&d.x>p.x&&d.x<p.x+p.w){if(d.type==='wide'){p.w=Math.min(170,p.w+35);setTimeout(()=>p.w=100,9000)}if(d.type==='life')lives=Math.min(5,lives+1);if(d.type==='slow'){b.dx*=.65;b.dy*=.65;setTimeout(()=>{b.dx*=1.54;b.dy*=1.54},6000)}sync();return false}return d.y<H});if(b.y>H){lives--;sync();if(lives<=0){end(false);draw();return}resetBall()}if(blocks.every(q=>!q.hp)&&!boss){if(stage===5){score+=500;sync();end(true);draw();return}stage++;score+=100;makeStage();$('status').textContent='Arena '+stage+'! A velocidade aumenta.';b.dx*=1.08;b.dy*=1.08;sync()}draw();raf=requestAnimationFrame(loop)}
function move(e){let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;p.x=Math.max(0,Math.min(W-p.w,x-p.w/2))}
$('start').onclick=start;c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});c.addEventListener('pointerdown',e=>{move(e);if(!playing)start()});document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});function hold(id,k){$(id).onpointerdown=e=>{e.preventDefault();keys[k]=true};$(id).onpointerup=$(id).onpointerleave=$(id).onpointercancel=()=>keys[k]=false}hold('left','left');hold('right','right');p={x:310,y:478,w:100,h:13};b={x:360,y:455,r:8};makeStage();playing=false;draw();
</script></body></html>
