name: Build BLACKLOUT PANTHER Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'games/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'offline.html'
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        working-directory: mobile
        run: npm install
      - name: Prepare website and Android project
        working-directory: mobile
        run: |
          npm run prepare:web
          npx cap add android
          npx cap sync android
          test -s www/assets/vendor/three.module.js
          test -s www/games/blacklou-legend/index.html
          node scripts/configure-android.mjs
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLACKLOUT-PANTHER-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
